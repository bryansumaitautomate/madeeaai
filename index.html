  </head>

  <body>
    <script type="text/javascript">
      (function(d, t) {
        var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
        v.onload = function() {
          var vfCss = [
            '/* Madeea dark theme — build 2026-02-24a */',
            '',
            '/* Chat shell */',
            '.vfrc-chat, .vfrc-chat--dialog { background: #0C0F14 !important; color: #E9ECFC !important; }',
            '.vfrc-header { background: #0C0F14 !important; border-bottom: 1px solid rgba(35,70,220,0.2) !important; }',
            '.vfrc-header--title { color: #fff !important; }',
            '.vfrc-header--subtitle { color: #94A3B8 !important; }',
            '.vfrc-assistant-info { background: #0C0F14 !important; }',
            '.vfrc-assistant-info--title { color: #fff !important; }',
            '.vfrc-assistant-info--description { color: #94A3B8 !important; }',
            '',
            '/* Messages */',
            '.vfrc-message { background: transparent !important; }',
            '.vfrc-system-response { background: transparent !important; }',
            '.vfrc-bubble { background: #161A22 !important; color: #E9ECFC !important; }',
            '.vfrc-message--response .vfrc-bubble, .vfrc-system-response .vfrc-bubble { background: #161A22 !important; color: #E9ECFC !important; border: 1px solid rgba(255,255,255,0.06) !important; border-radius: 12px !important; }',
            '.vfrc-message--request .vfrc-bubble, .vfrc-user-response .vfrc-bubble { background: #2346DC !important; color: #fff !important; }',
            '.vfrc-system-response .vfrc-message { color: #E9ECFC !important; }',
            '.vfrc-message p, .vfrc-message span, .vfrc-bubble p, .vfrc-bubble span { color: inherit !important; }',
            '.vfrc-message a { color: #5B8DEF !important; }',
            '',
            '/* Cards */',
            '.vfrc-card { background: #161A22 !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 12px !important; overflow: hidden !important; }',
            '.vfrc-card--title, .vfrc-card--description { color: #E9ECFC !important; }',
            '.vfrc-card--image { border-bottom: 1px solid rgba(255,255,255,0.06) !important; }',
            '.vfrc-card--action, .vfrc-card--button { background: #161A22 !important; color: #E9ECFC !important; border: 1px solid rgba(35,70,220,0.3) !important; }',
            '.vfrc-card--action:hover, .vfrc-card--button:hover { background: #1e2430 !important; border-color: rgba(35,70,220,0.6) !important; }',
            '.vfrc-carousel { background: transparent !important; }',
            '',
            '/* Chips / buttons */',
            '.vfrc-button, .vfrc-chip { background: #161A22 !important; color: #E9ECFC !important; border: 1px solid rgba(35,70,220,0.3) !important; }',
            '.vfrc-button:hover, .vfrc-chip:hover { background: #1e2430 !important; border-color: rgba(35,70,220,0.6) !important; }',
            '',
            '/* Footer & input — color only, no layout overrides */',
            '.vfrc-footer, .vf-footer { background: #0C0F14 !important; border-top: 1px solid rgba(255,255,255,0.06) !important; }',
            '.vfrc-chat-input { background: #0C0F14 !important; }',
            '.vfrc-input { background: #161A22 !important; color: #E9ECFC !important; }',
            '.vfrc-input textarea, .vfrc-input input { background: transparent !important; color: #E9ECFC !important; caret-color: #E9ECFC !important; }',
            '.vfrc-input textarea::placeholder, .vfrc-input input::placeholder { color: #64748B !important; }',
            '',
            '/* Send button */',
            '.vfrc-chat-input--button { display: inline-flex !important; align-items: center !important; justify-content: center !important; color: #E9ECFC !important; }',
            '.vfrc-chat-input--button svg { stroke: currentColor !important; }',
            '.vfrc-chat-input--button:hover { color: #3b82f6 !important; }',
            '',
            '/* Loading */',
            '.vfrc-loading, .vfrc-typing { background: transparent !important; }',
            '.vfrc-typing-indicator { background: #161A22 !important; }',
            '',
            '/* Launcher — Ion Blue with glow */',
            '.vfrc-launcher { background: linear-gradient(135deg, #3b82f6, #2346DC) !important; border: 1px solid rgba(59,130,246,0.3) !important; box-shadow: 0 0 30px rgba(59,130,246,0.4), 0 0 60px rgba(35,70,220,0.2) !important; color: #fff !important; }',
            '.vfrc-launcher:hover { background: linear-gradient(135deg, #2563eb, #1a38b8) !important; box-shadow: 0 0 40px rgba(59,130,246,0.5), 0 0 80px rgba(35,70,220,0.3) !important; }',
            '.vfrc-launcher:active, .vfrc-launcher:focus { background: linear-gradient(135deg, #3b82f6, #2346DC) !important; }',
            '.vfrc-launcher svg { color: #fff !important; stroke: #fff !important; }',
            '.vfrc-launcher span { color: #fff !important; }',
            '',
            '/* Scroll-to-bottom / down button */',
            '.vfrc-chat .vfrc-button--scroll, [class*="ScrollDown"], [class*="scrollDown"] { background: #2346DC !important; color: #fff !important; border: 1px solid rgba(59,130,246,0.3) !important; box-shadow: 0 0 16px rgba(35,70,220,0.4) !important; }',
            '.vfrc-chat .vfrc-button--scroll:hover, [class*="ScrollDown"]:hover, [class*="scrollDown"]:hover { background: #1a38b8 !important; box-shadow: 0 0 24px rgba(35,70,220,0.5) !important; }',
            '.vfrc-chat .vfrc-button--scroll svg, [class*="ScrollDown"] svg, [class*="scrollDown"] svg { stroke: #fff !important; color: #fff !important; }',
            '',
            '/* Text elements inside chat */',
            '.vfrc-chat p, .vfrc-chat span, .vfrc-chat h1, .vfrc-chat h2, .vfrc-chat h3, .vfrc-chat label { color: #E9ECFC !important; }',
            '.vfrc-chat a { color: #5B8DEF !important; }',
            '.vfrc-chat img { border-radius: 8px !important; }'
          ].join('\n');

          var vfCssUrl = 'data:text/css;charset=utf-8,' + encodeURIComponent(vfCss);

          /* Layer 1: official assistant.stylesheet */
          window.voiceflow.chat.load({
            verify: { projectID: '699daccdde2b01982d12ac5e' },
            url: 'https://general-runtime.voiceflow.com',
            versionID: 'production',
            voice: { url: "https://runtime-api.voiceflow.com" },
            render: {
              mode: 'overlay',
              theme: {
                primaryColor: '#2346DC',
                backgroundColor: '#0C0F14',
                textColor: '#E9ECFC'
              }
            },
            assistant: {
              stylesheet: vfCssUrl
            }
          });

          /* Layer 2: Shadow DOM injection fallback */
          function injectVfStyles() {
            var host = document.getElementById('voiceflow-chat');
            if (!host || !host.shadowRoot) return;
            var sr = host.shadowRoot;
            var existing = sr.getElementById('madeea-vf-theme');
            if (existing) {
              existing.textContent = vfCss;
              return;
            }
            var style = document.createElement('style');
            style.id = 'madeea-vf-theme';
            style.textContent = vfCss;
            sr.appendChild(style);
          }

          var observer = new MutationObserver(function() { injectVfStyles(); });
          observer.observe(document.body, { childList: true, subtree: true });
          setTimeout(injectVfStyles, 500);
          setTimeout(injectVfStyles, 1500);
          setTimeout(injectVfStyles, 3000);
          setTimeout(injectVfStyles, 5000);
        };
        v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
        v.type = "text/javascript";
        s.parentNode.insertBefore(v, s);
      })(document, 'script');
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
