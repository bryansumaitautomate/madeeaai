          // Fallback: also inject styles directly into shadow DOM
          var injectStyles = function() {
            var el = document.getElementById('voiceflow-chat') || document.querySelector('div[id^="voiceflow"]');
            if (!el || !el.shadowRoot) return false;
            if (el.shadowRoot.querySelector('[data-madeea-theme]')) return true;
            var s = document.createElement('style');
            s.setAttribute('data-madeea-theme', '1');
            s.textContent = css;
            el.shadowRoot.appendChild(s);
            return true;
          };
          var attempts = 0;
          var iv = setInterval(function() {
            if (injectStyles() || ++attempts > 60) clearInterval(iv);
          }, 500);
        };
        v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
        v.type = "text/javascript";
        s.parentNode.insertBefore(v, s);
