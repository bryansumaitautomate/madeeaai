  </head>

  <body>
    <script type="text/javascript">
      (function(d, t) {
        var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
        v.onload = function() {
          var css = [
            '.vfrc-chat,.vfrc-chat--dialog,.vfrc-header,.vfrc-footer,.vfrc-chat-input,.vfrc-assistant-info{background-color:#0C0F14!important}',
            '.vfrc-header{border-bottom:1px solid rgba(35,70,220,0.2)!important}',
            '.vfrc-header--title{color:#fff!important}',
            '.vfrc-header--subtitle{color:#94A3B8!important}',
            '.vfrc-message{background:transparent!important}',
            '.vfrc-message--response,.vfrc-system-response .vfrc-bubble,.vfrc-bubble{background:#161A22!important;color:#E9ECFC!important;border:1px solid rgba(255,255,255,0.06)!important;border-radius:12px!important}',
            '.vfrc-message--request,.vfrc-user-response .vfrc-bubble{background:#2346DC!important;color:#fff!important}',
            '.vfrc-system-response{background:transparent!important}',
            '.vfrc-footer{border-top:1px solid rgba(255,255,255,0.06)!important}',
            '.vfrc-assistant-info--title{color:#fff!important}',
            '.vfrc-assistant-info--description{color:#94A3B8!important}',
            '.vfrc-button,.vfrc-chip{background:#161A22!important;color:#E9ECFC!important;border:1px solid rgba(35,70,220,0.3)!important}',
            '.vfrc-button:hover,.vfrc-chip:hover{background:#1e2430!important;border-color:rgba(35,70,220,0.6)!important}',
            '.vfrc-card{background:#161A22!important;border:1px solid rgba(255,255,255,0.08)!important;border-radius:12px!important;overflow:hidden!important}',
            '.vfrc-card--title,.vfrc-card--description{color:#E9ECFC!important}',
            '.vfrc-card--action,.vfrc-card--button{background:#161A22!important;color:#E9ECFC!important;border:1px solid rgba(35,70,220,0.3)!important}',
            '.vfrc-card--action:hover,.vfrc-card--button:hover{background:#1e2430!important;border-color:rgba(35,70,220,0.6)!important}',
            '.vfrc-carousel{background:transparent!important}',
            '.vfrc-loading,.vfrc-typing{background:transparent!important}',
            '.vfrc-typing-indicator{background:#161A22!important}',
            '.vfrc-launcher{background:#1e2430!important;border:1px solid rgba(59,130,246,0.25)!important;box-shadow:0 0 20px rgba(59,130,246,0.3),0 0 40px rgba(59,130,246,0.15),inset 0 1px 0 rgba(255,255,255,0.1)!important}',
            '.vfrc-launcher:hover{box-shadow:0 0 28px rgba(59,130,246,0.45),0 0 56px rgba(59,130,246,0.2),inset 0 1px 0 rgba(255,255,255,0.15)!important;border-color:rgba(59,130,246,0.4)!important;transform:scale(1.03)!important}',
            'textarea,input{background:#161A22!important;color:#E9ECFC!important;-webkit-text-fill-color:#E9ECFC!important;caret-color:#E9ECFC!important;border:1px solid rgba(255,255,255,0.1)!important;outline:none!important;box-shadow:none!important}',
            'textarea:focus,input:focus,textarea:focus-visible,input:focus-visible{outline:none!important;box-shadow:none!important;border-color:rgba(255,255,255,0.15)!important}',
            'textarea::placeholder,input::placeholder{color:#64748B!important;-webkit-text-fill-color:#64748B!important}',
            '*:focus,*:focus-visible{outline:none!important}',
            '[class*="powered"],[class*="Powered"],[class*="branding"],[class*="Branding"],[class*="credit"],[class*="Credit"],[class*="watermark"],[class*="Watermark"]{display:none!important}',
            'p,span,li,ul,ol,h1,h2,h3,h4,h5,h6,label,div{color:#E9ECFC!important}',
            'a{color:#5B8DEF!important}',
            'button{background:#1e2430!important;color:#E9ECFC!important;border:1px solid rgba(255,255,255,0.1)!important}',
            'button:hover{background:#2a303d!important}',
            'div[class*="input"],div[class*="Input"]{background:#0C0F14!important}',
            'form,fieldset{background:transparent!important;border:none!important}'
          ].join('\n');

          var dataUri = 'data:text/css;base64,' + btoa(css);

          window.voiceflow.chat.load({
            verify: { projectID: '699daccdde2b01982d12ac5e' },
            url: 'https://general-runtime.voiceflow.com',
            versionID: 'production',
            voice: { url: "https://runtime-api.voiceflow.com" },
            render: {
              mode: 'overlay',
              theme: {
                primaryColor: '#2346DC',
                backgroundColor: '#070E2C',
                textColor: '#E9ECFC'
              }
            },
            assistant: {
              stylesheet: dataUri
            }
          });

          // Fallback: also inject styles directly into shadow DOM
          var injectStyles = function() {
            var el = document.getElementById('voiceflow-chat') || document.querySelector('div[id^="voiceflow"]');
            if (!el || !el.shadowRoot) return false;
            if (el.shadowRoot.querySelector('[data-madeea-theme]')) return true;
            var s = document.createElement('style');
            s.setAttribute('data-madeea-theme', '1');
            s.textContent = css;
            el.shadowRoot.appendChild(s);
            return true;
          };
          var attempts = 0;
          var iv = setInterval(function() {
            if (injectStyles() || ++attempts > 60) clearInterval(iv);
          }, 500);
        };
        v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
        v.type = "text/javascript";
        s.parentNode.insertBefore(v, s);
      })(document, 'script');
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
